# Canonical catalog of PII categories (Step 3).
#
# Every `pii_type` referenced by regex_rules.yaml and ner_labels.yaml MUST exist
# here: adding a category = adding an entry, zero code (§2.3.10). `id` is a flat,
# stable identifier; the regulatory framework stays a separate piece of metadata
# (`frameworks`).
categories:
  - id: email
    label: "Email address"
    frameworks: [gdpr, nlpd]
  - id: phone
    label: "Phone number"
    frameworks: [gdpr, nlpd]
  - id: iban
    label: "IBAN"
    frameworks: [gdpr, nlpd]
  - id: credit_card
    label: "Credit card number"
    frameworks: [gdpr, nlpd, pci_dss]
  - id: swiss_avs
    label: "Swiss AVS"
    frameworks: [nlpd]
  - id: ip_address
    label: "IP address"
    frameworks: [gdpr, nlpd]
  - id: person_name
    label: "Person's name"
    frameworks: [gdpr, nlpd]
  - id: address
    label: "Address"
    frameworks: [gdpr, nlpd]
  - id: date_of_birth
    label: "Date of birth"
    frameworks: [gdpr, nlpd]
  - id: italian_id
    label: "Italian tax code (codice fiscale)"
    frameworks: [gdpr]
  - id: health_data
    label: "Health related data"
    frameworks: [gdpr, nlpd]
    special_category: true
