# Config-driven regex rules (Step 3).
#
# This file declares the structure: Step 3 validates shape, confidence range,
# that every `pattern` compiles and every `pii_type` exists in the catalog. RULE
# EXECUTION belongs to Step 4 (RegexDetector).
#
# ---------------------------------------------------------------------------
# FIELD REFERENCE / LEGEND  (schema: RegexRuleModel in detection/config.py)
#
# Required fields — every rule MUST set these three:
#   rule_id   : unique id of the rule within this file (e.g. "iban_v1").
#   pii_type  : category the rule produces; MUST exist in categories.yaml.
#   pattern   : regex source; must compile (checked at load time).
#
# Optional fields — they *look* optional because the schema defines a default
# for each: omit a field to accept its default, set it only to override.
#   flags            : list of Python `re` flag names to compile the pattern
#                      with. Default: ["UNICODE"]. Allowed names: IGNORECASE,
#                      MULTILINE, DOTALL, UNICODE, VERBOSE, ASCII.
#   base_confidence  : confidence assigned to a match, in [0, 1]. Default: 0.6.
#
# NOTE: checksum validation of structured identifiers (IBAN, credit card,
# AVS...) is intentionally NOT implemented yet — tracked as a future
# development in doc/sviluppi-futuri.md.
# ---------------------------------------------------------------------------
rules:
  - rule_id: email
    pii_type: email
    pattern: '\b((?!\.)[\w\-_.]*[^.])(@\w+)(\.\w+(\.\w+)?[^.\W])\b'
    base_confidence: 0.7

  - rule_id: iban
    pii_type: iban
    pattern: "\\b[A-Z]{2}\\d{2}(?:[ ]?[A-Za-z0-9]){11,30}\\b"
    base_confidence: 0.6

  - rule_id: credit_card
    pii_type: credit_card
    pattern: "\\b(?:\\d[ -]?){13,19}\\b"
    base_confidence: 0.5

  - rule_id: ip_address
    pii_type: ip_address
    pattern: "\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b"
    base_confidence: 0.5

  - rule_id: italian_id
    pii_type: italian_id
    pattern: "\\b[A-Z]{6}[0-9]{2}[ABCDEHLMPRST][0-9]{2}[A-Z][0-9]{3}[A-Z]\\b"
    base_confidence: 0.7
