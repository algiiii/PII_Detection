# Mapping Presidio entity_type -> pii_type of the catalog.

entities:
  - entity: EMAIL_ADDRESS
    pii_type: email
  - entity: PHONE_NUMBER
    pii_type: phone
  - entity: IBAN_CODE
    pii_type: iban
  - entity: CREDIT_CARD
    pii_type: credit_card
  - entity: IP_ADDRESS
    pii_type: ip_address
  - entity: IT_FISCAL_CODE
    pii_type: italian_id
  - entity: PERSON
    pii_type: person_name
  - entity: LOCATION
    pii_type: address
  - entity: DATE_TIME
    pii_type: date_of_birth
  # Swiss AVS is not covered by Presidio; it is detected by the config-driven
  # RegexDetector over custom_patterns.yaml, which emits the pii_type directly.
  # Free-text health data, prompted zero-shot to GLiNER (see _GLINER_ENTITY_MAPPING).
  - entity: MEDICAL_CONDITION
    pii_type: health_data
