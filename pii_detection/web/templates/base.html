<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Conformità PII{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; line-height: 1.5; color: #1a1a1a; background: #f7f7f8;
    }
    header {
      background: #1f2937; color: #fff; padding: .9rem 1.5rem;
      display: flex; gap: 1.4rem; align-items: baseline;
    }
    header .brand { font-weight: 700; }
    header a { color: #cbd5e1; text-decoration: none; font-weight: 600; }
    header a.active, header a:hover { color: #fff; }
    main { max-width: 980px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; border-bottom: 1px solid #e5e7eb; padding-bottom: .3rem; }
    a { color: #2563eb; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #eef0f2; }
    th { background: #f3f4f6; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: #6b7280; }
    tr:last-child td { border-bottom: none; }
    dl { display: grid; grid-template-columns: 180px 1fr; gap: .35rem 1rem; background: #fff; padding: 1rem; border-radius: 8px; }
    dt { font-weight: 600; color: #6b7280; }
    dd { margin: 0; }
    .muted { color: #9ca3af; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: .9rem 1rem; margin-bottom: .8rem; }
    .tag { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 6px; padding: .1rem .5rem; margin: .1rem .2rem .1rem 0; font-size: .8rem; }
    .badge { display: inline-block; border-radius: 999px; padding: .1rem .6rem; font-size: .75rem; font-weight: 600; }
    .badge.ok   { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef9c3; color: #854d0e; }
    .badge.bad  { background: #fee2e2; color: #991b1b; }
    .badge.info { background: #e0f2fe; color: #075985; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .checks { display: flex; flex-wrap: wrap; gap: .35rem 1.2rem; margin: .5rem 0; }
    .checks label { display: inline-flex; align-items: center; gap: .35rem; font-weight: 400; }
    input, select { font: inherit; }
    button, .btn { font: inherit; cursor: pointer; border: 1px solid #2563eb; background: #2563eb; color: #fff; padding: .4rem .8rem; border-radius: 6px; text-decoration: none; display: inline-block; }
    code { background: #f3f4f6; padding: .05rem .3rem; border-radius: 4px; font-size: .85em; }
  </style>
</head>
<body>
  <header>
    <span class="brand">PII Discovery</span>
    <a href="{{ url_for('documents') }}">Conformità</a>
    <a href="/ropa/">Trattamenti (ROPA)</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
