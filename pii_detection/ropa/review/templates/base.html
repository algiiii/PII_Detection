<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ROPA{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; line-height: 1.5; color: #1a1a1a; background: #f7f7f8;
    }
    header {
      background: #1f2937; color: #fff; padding: .9rem 1.5rem;
      display: flex; gap: 1.4rem; align-items: baseline;
    }
    header .brand { font-weight: 700; }
    header a { color: #cbd5e1; text-decoration: none; font-weight: 600; }
    header a.active, header a:hover { color: #fff; }
    main { max-width: 980px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; border-bottom: 1px solid #e5e7eb; padding-bottom: .3rem; }
    h3 { font-size: .95rem; margin: 1rem 0 .3rem; color: #374151; }
    a { color: #2563eb; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #eef0f2; }
    th { background: #f3f4f6; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: #6b7280; }
    tr:last-child td { border-bottom: none; }
    dl { display: grid; grid-template-columns: 180px 1fr; gap: .35rem 1rem; background: #fff; padding: 1rem; border-radius: 8px; }
    dt { font-weight: 600; color: #6b7280; }
    dd { margin: 0; }
    .muted { color: #9ca3af; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: .7rem .9rem; margin-bottom: .6rem; }
    .tag { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 6px; padding: .1rem .5rem; margin: .1rem .2rem .1rem 0; font-size: .8rem; }
    .badge { display: inline-block; border-radius: 999px; padding: .1rem .6rem; font-size: .75rem; font-weight: 600; }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef9c3; color: #854d0e; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .actions { display: flex; align-items: center; gap: .5rem; }
    .stack { display: flex; flex-direction: column; gap: .6rem; }
    .stack label { display: flex; flex-direction: column; gap: .2rem; font-weight: 600; color: #374151; font-size: .85rem; }
    .field-label { font-weight: 600; color: #374151; font-size: .85rem; }
    input, textarea, select { font: inherit; padding: .4rem .5rem; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
    textarea { resize: vertical; }
    /* PII checkboxes: horizontal, wrapping — override the .stack column layout */
    .checks { display: flex; flex-wrap: wrap; gap: .3rem 1rem; margin-top: .3rem; }
    .stack .checks label, .checks label { display: inline-flex; flex-direction: row; align-items: center; gap: .35rem; font-weight: 400; color: #1a1a1a; margin: 0; }
    .checks input { padding: 0; margin: 0; }
    button, .btn { font: inherit; cursor: pointer; border: 1px solid #2563eb; background: #2563eb; color: #fff; padding: .4rem .8rem; border-radius: 6px; text-decoration: none; display: inline-block; }
    .btn { font-weight: 600; }
    button.danger, .btn.danger { background: #fff; color: #b91c1c; border-color: #fca5a5; }
    details { margin-top: .5rem; }
    summary { cursor: pointer; color: #2563eb; font-weight: 600; font-size: .9rem; }
    details.add { background: #fff; border: 1px dashed #cbd5e1; border-radius: 8px; padding: .7rem .9rem; margin-bottom: .6rem; }
    details.add > summary { list-style: none; }
    details[open].add { padding-bottom: .9rem; }
  </style>
</head>
<body>
  {# shared nav — keep in sync with pii_detection/web/templates/base.html #}
  <header>
    <span class="brand">PII Discovery</span>
    <a href="/">Conformità</a>
    <a href="/scan">Scansione</a>
    <a href="/rules">Regole</a>
    <a href="/retention">Conservazione</a>
    <a href="/ropa/">Trattamenti (ROPA)</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
