<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ROPA{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0; line-height: 1.5; color: #1a1a1a; background: #f7f7f8;
    }
    header {
      background: #1f2937; color: #fff; padding: .9rem 1.5rem;
    }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 980px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; border-bottom: 1px solid #e5e7eb; padding-bottom: .3rem; }
    h3 { font-size: .95rem; margin: 1rem 0 .3rem; color: #374151; }
    a { color: #2563eb; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #eef0f2; }
    th { background: #f3f4f6; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: #6b7280; }
    tr:last-child td { border-bottom: none; }
    dl { display: grid; grid-template-columns: 180px 1fr; gap: .35rem 1rem; background: #fff; padding: 1rem; border-radius: 8px; }
    dt { font-weight: 600; color: #6b7280; }
    dd { margin: 0; }
    .muted { color: #9ca3af; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: .7rem .9rem; margin-bottom: .6rem; }
    .tag { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 6px; padding: .1rem .5rem; margin: .1rem .2rem .1rem 0; font-size: .8rem; }
    .badge { display: inline-block; border-radius: 999px; padding: .1rem .6rem; font-size: .75rem; font-weight: 600; }
    .badge.ok { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef9c3; color: #854d0e; }
  </style>
</head>
<body>
  <header><a href="/">ROPA · Registro dei trattamenti</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
