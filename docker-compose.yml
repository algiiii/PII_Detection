# Portable, cross-platform run of the whole system: `docker compose up` works on
# any host with Docker, regardless of its architecture (no Rosetta/x86 concerns).
# Each heavy/service functionality is its own container, configured via env.
services:
  app:
    build: .
    # The app is the interface: serve the DPO web UI (dashboard + mounted ROPA
    # review) on a port. `docker compose exec app ...` still works for the CLIs.
    command: python -m pii_detection.web --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # Services are reached by name on the compose network (no hardcoded hosts).
      OLLAMA_HOST: http://ollama:11434
      ROPA_LLM_MODEL: phi4-mini
      # Canonical store: the host ./data dir, reached at /app/data via the repo
      # bind-mount below (relative sqlite URL). Same file locally and in-container.
      ROPA_DB_URL: sqlite:///data/ropa.db
      PII_DB_URL: sqlite:///data/pii.db
      HF_HOME: /models/hf
    volumes:
      - .:/app                 # live source + shared ./data (no rebuild on changes)
      - hf-cache:/models/hf    # GLiNER / HuggingFace model cache (persisted)
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama   # pulled LLM models persist here
    ports:
      - "11434:11434"

volumes:
  hf-cache:
  ollama-models:
