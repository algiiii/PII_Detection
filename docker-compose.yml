# Portable, cross-platform run of the whole system: `docker compose up` works on
# any host with Docker, regardless of its architecture (no Rosetta/x86 concerns).
# Each heavy/service functionality is its own container, configured via env.
services:
  app:
    build: .
    # The app is the interface: serve the DPO web UI (dashboard + mounted ROPA
    # review) on a port. `docker compose exec app ...` still works for the CLIs.
    command: python -m pii_detection.web --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # Services are reached by name on the compose network (no hardcoded hosts).
      OLLAMA_HOST: http://ollama:11434
      ROPA_LLM_MODEL: phi4-mini
      # Model for the AI detection second opinion (B4), kept separate from the ROPA
      # mapper's model so the two AI tasks can differ. Pull it first (see ollama below).
      PII_LLM_MODEL: phi4-mini
      # Default AI sampling for a scan: it pre-selects the option in the /scan menu,
      # where the operator picks per scan (0 = off, 1 = every doc, N = ~1 in N).
      # Off by default — the DPO opts in and chooses the rate; raise it here to make
      # a rate the deployment default (e.g. "100" for a light automatic sample).
      PII_AI_SAMPLING_RATE: "0"
      # Canonical store: the host ./data dir, reached at /app/data via the repo
      # bind-mount below (relative sqlite URL). Same file locally and in-container.
      ROPA_DB_URL: sqlite:///data/ropa.db
      PII_DB_URL: sqlite:///data/pii.db
      HF_HOME: /models/hf
    volumes:
      - .:/app                 # live source + shared ./data (no rebuild on changes)
      - hf-cache:/models/hf    # GLiNER / HuggingFace model cache (persisted)
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama   # pulled LLM models persist here
    ports:
      - "11434:11434"
    # Models are pulled manually once (they persist in the volume above):
    #   docker compose exec ollama ollama pull phi4-mini
    # Before running the multi-model benchmark, also pull the other tiers:
    #   docker compose exec ollama ollama pull qwen3:4b
    #   docker compose exec ollama ollama pull gemma3:4b
    #   docker compose exec ollama ollama pull qwen2.5:7b
    #   docker compose exec ollama ollama pull gemma3:12b   # several GB — check volume space
    # No healthcheck here (the base image ships no curl/wget); the detector degrades
    # gracefully if Ollama is unreachable, so a missing model never aborts a scan.

volumes:
  hf-cache:
  ollama-models:
