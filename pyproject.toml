[project]
name = "pii-detection"
version = "0.1.0"
description = "Motore di rilevamento PII (blocco B4): regex + NER zero-shot + AI selettiva"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

# Gruppi opzionali
[project.optional-dependencies]
ner = ["gliner>=0.2.13",]
ropa = [
    "openpyxl>=3.1",
    "odfpy>=1.4",
    "sqlmodel>=0.0.16",
]
review = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

#   python -m spacy download it_core_news_lg
presidio = [
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
]

# Local, CPU-friendly generative AI runtime (selective-AI tasks). Model pulled
# separately, e.g.: ollama pull qwen2.5:3b
llm = ["ollama>=0.6"]

docs = [
    "sphinx>=7.3",
    "furo>=2024.5",
    "sphinx-autodoc-typehints>=2.1",
]

# Dev tooling (previously installed ad-hoc in the local venv, undeclared).
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pii_detection*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pii_detection"]

# Presidio, spaCy, openpyxl and odfpy ship no type stubs; silence missing-import
# errors for them under --strict. Cfr. tesi §sec:valutazione-presidio.
[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "spacy.*", "openpyxl.*", "odf.*", "ollama.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pii_detection/tests"]
# Deselect manual/visual tests by default; run them with: pytest -m manual -s
addopts = "-m 'not manual'"
markers = [
    "manual: visual/interactive checks, not part of the automated suite",
]
